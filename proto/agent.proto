syntax = "proto3";
package orrery.agent.v1;
option go_package = "github.com/ductone/orrey/internal/agentproto/gen;agentv1";
import "google/protobuf/struct.proto";
import "google/protobuf/duration.proto";
service Agent { rpc Run(TaskRequest) returns (stream AgentEvent); rpc Cancel(CancelRequest) returns (CancelResponse); }
message Budget { uint64 max_tokens=1; double max_usd=2; google.protobuf.Duration max_wallclock=3; uint32 max_depth=4; }
message Workspace { string path=1; string isolation=2; }
message RoutingHints { string tier_pin=1; repeated string family_excludes=2; bool review=3; string implementer_family=4; }
message AttachmentRef { string id=1; string path=2; string media_type=3; string filename=4; }
message TaskRequest { string spec=1; google.protobuf.Struct result_schema=2; Budget budget=3; Workspace workspace=4; RoutingHints hints=5; uint32 depth=6; repeated AttachmentRef attachments=7; }
enum Status { STATUS_UNSPECIFIED=0; PASS=1; FAIL=2; BUDGET_EXHAUSTED=3; CANCELLED=4; INPUT_REQUIRED=5; }
message InputRequest { string id=1; string question=2; repeated string choices=3; bool allow_freeform=4; }
message Outcome { uint64 tokens=1; double cost_usd=2; google.protobuf.Duration latency=3; uint32 tool_calls=4; uint32 tool_errors=5; uint32 edit_retries=6; uint32 edit_attempts=7; }
message ArtifactRef { string path=1; string description=2; }
message TaskResult { Status status=1; google.protobuf.Struct result=2; Outcome outcome=3; repeated ArtifactRef artifacts=4; string error=5; }
message AgentEvent { string type=1; google.protobuf.Struct data=2; TaskResult terminal=3; InputRequest input_required=4; }
message CancelRequest { string job_id=1; }
message CancelResponse { bool cancelled=1; }
