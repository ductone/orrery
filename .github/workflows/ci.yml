name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Install Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.57.0
      - name: Proto lint
        run: buf lint
      - name: Proto breaking changes
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=origin/main'
      - name: Generated proto is current
        run: |
          buf generate
          git diff --exit-code
      - name: Build
        run: go build ./cmd/orrery
