listen: "127.0.0.1:7433"
workspace_root: "~/src"
database: ".orrery/orrery.db"
providers:
  anthropic: {api_key: "!cmd op read op://dev/anthropic/key"}
  ramp: {api_key: "!env RAMP_ROUTER_API_KEY"} # Ramp Router; base_url defaults to https://api.router.com
  # Add provider_keys: [bedrock] once the Ramp account has its own Bedrock key,
  # to route to models Ramp serves only through Bedrock.
  openai: {api_key: "!cmd op read op://dev/openai/key"}
  xai: {api_key: "!cmd op read op://dev/xai/key"}
  together: {api_key: "!cmd op read op://dev/together/key"}
mcp:
  c1-gateway:
    transport: http
    url: "https://mcp.internal.example/v1"
    auth_header: "!cmd op read op://dev/c1-gateway/token"
lsp:
  gopls:
    command: ["gopls"]
    extensions: [".go"]
    language_id: "go"
router:
  lambda_cost: 0.35
  frontier_floor_phases: [plan, diagnose]
  disable_switch: false
budget:
  session_usd: 25
  job_default_fraction: 0.2
  min_review_usd: 2
# Models are discovered from Ramp Router at startup and merged with the
# built-in catalog. Override any field, promote, or disable a model here.
# models:
#   - id: ramp/qwen4-coder
#     tier: frontier
#   - id: ramp/some-flaky-model
#     disabled: true
interventions:
  # Expensive interventions (worker spawn, model escalation, terminal stall) are
  # gated by a cheap LLM judge; the counters that trigger them are deliberately
  # over-sensitive. On a "not stuck" verdict the tripping signal's floor rises
  # to 1.5x its observed value, so the same question is not re-asked every turn.
  judge_enabled: true
  judge_backoff: 1.5
  judge_timeout_seconds: 20
  # judge_model: ramp/gpt-5.6-luna   # default: cheapest configured model
# Shadow observations from TypeSafe's Jev classifier. Answers are recorded next
# to the harness's own decision and never change behaviour. Each listed site
# sends session content (task text, plan, tool calls, diffs) to TypeSafe.
# jev:
#   api_key: "!env TYPESAFE_API_KEY"
#   shadow: [stall_judge, phase, difficulty, review]
#   # Adds an intent parameter to search; broad matches are ranked by relevance.
#   # Sends each matching file's path and sampled matching lines to TypeSafe.
#   search_ranking: true
#   # Jev-assisted independent review: triage the diff, size reviewers, downgrade
#   # findings that are not bugs, decide when read-only workers have converged,
#   # and accept low-risk parts of an inconclusive review. Sends changed files'
#   # patches and reviewer findings to TypeSafe.
#   review: true
#   # Choose the phase of a turn that starts with a new user message, instead
#   # of always planning it. Sends the message, task, and todo plan to TypeSafe.
#   routing: true
#   timeout_seconds: 5
telemetry:
  otlp_endpoint: "http://localhost:4318"
web_search:
  provider: brave
  api_key: "!cmd op read op://dev/brave/key"
