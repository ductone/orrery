<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orrery</title><style>
:root{color-scheme:dark;--bg:#111216;--panel:#191b21;--line:#2a2d35;--text:#e8e6df;--muted:#9599a5;--gold:#e6b85c;--blue:#77a7d9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#20232b 0,var(--bg) 38%);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,monospace;height:100vh;display:grid;grid-template-columns:270px 1fr}.side{border-right:1px solid var(--line);padding:24px 16px;overflow:auto}.brand{font:600 25px Georgia,serif;letter-spacing:.12em;color:var(--gold);margin-bottom:24px}.new{width:100%;background:var(--gold);color:#18140c;border:0;border-radius:6px;padding:10px;font-weight:700}.session{padding:10px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--muted)}.session:hover{color:var(--text)}main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.top{padding:17px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.meter{color:var(--gold)}#events{overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:13px;white-space:pre-wrap;overflow-wrap:anywhere}.routing{border-left:3px solid var(--gold)}.tool{border-left:3px solid var(--blue)}.muted{color:var(--muted)}form{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px}textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:12px}button{cursor:pointer}form button{background:#303746;color:var(--text);border:1px solid #465064;border-radius:6px;padding:0 18px}@media(max-width:720px){body{grid-template-columns:1fr}.side{display:none}}
</style></head><body><aside class="side"><div class="brand">ORRERY</div><button class="new" onclick="newSession()">New session</button><div id="sessions"></div></aside><main><header class="top"><span id="title">Select a session</span><span class="meter" id="meter">$0.0000</span></header><section id="events"></section><form onsubmit="send(event)"><textarea id="prompt" rows="3" placeholder="Give Orrery a task…"></textarea><button>Send</button></form></main><script>
let current=null,es=null,cost=0;const $=s=>document.querySelector(s);async function load(){let xs=await(await fetch('/api/sessions')).json();$('#sessions').innerHTML=xs.map(x=>`<div class=session onclick="openSession('${x.ID||x.id}')">${esc(x.Spec||x.spec).slice(0,50)}<br><small>${x.Status||x.status} · ${x.Phase||x.phase}</small></div>`).join('')}function esc(s=''){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}async function newSession(){let p=prompt('Task for Orrery');if(!p)return;let x=await(await fetch('/sessions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:p})})).json();load();openSession(x.id)}function openSession(id){current=id;cost=0;$('#events').innerHTML='';$('#title').textContent=id;es?.close();es=new EventSource(`/sessions/${id}/events`);es.onmessage=render;['routing.decision','routing.fallback','assistant.message','tool.started','tool.finished','todo.updated','job.started','job.terminal','session.terminal','context.compacted'].forEach(t=>es.addEventListener(t,render))}function render(ev){let x=JSON.parse(ev.data),type=x.Type||x.type||ev.type,data=x.Data||x.data;if(type==='assistant.message'&&data.cost_usd){cost+=data.cost_usd;$('#meter').textContent='$'+cost.toFixed(4)}let c=document.createElement('div');c.className='card '+(type.startsWith('routing')?'routing':type.startsWith('tool')?'tool':'');c.innerHTML=`<div class=muted>${esc(type)}</div>${esc(JSON.stringify(data,null,2))}`;$('#events').append(c);c.scrollIntoView()}async function send(e){e.preventDefault();let p=$('#prompt').value.trim();if(!p)return;if(!current){let x=await(await fetch('/sessions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:p})})).json();openSession(x.id)}else await fetch(`/sessions/${current}/messages`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content:p})});$('#prompt').value='';load()}load();
</script></body></html>
